name: Skompiluj Moje APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Vytvor kompletne celú apku správne
      run: |
        # 1. Vytvorenie štruktúry pre Android projekt mimo zložky .github
        mkdir -p ŠTRUKTÚRA/app/src/main/assets
        mkdir -p ŠTRUKTÚRA/app/src/main/java/com/vlaky/app

        # 2. Nastavenie Gradle buildov
        echo 'plugins { id "com.android.application" version "8.1.1" }
        android {
            namespace "com.vlaky.app"
            compileSdk 34
            defaultConfig {
                applicationId "com.vlaky.app"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }' > ŠTRUKTÚRA/app/build.gradle

        echo 'plugins { id "com.android.application" version "8.1.1" apply false }' > ŠTRUKTÚRA/build.gradle
        echo 'include ":app"' > ŠTRUKTÚRA/settings.gradle

        # 3. Vytvorenie Manifestu s povolením na internet
        echo '<?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:usesCleartextTraffic="true">
                <activity android:name="com.vlaky.app.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>' > ŠTRUKTÚRA/app/src/main/AndroidManifest.xml

        # 4. Čistý JAVA kód s prehliadačom
        echo 'package com.vlaky.app;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings ws = webView.getSettings();
                ws.setJavaScriptEnabled(true);
                ws.setDomStorageEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                setContentView(webView);
                webView.loadUrl("file:///android_asset/index.html");
            }
        }' > ŠTRUKTÚRA/app/src/main/java/com/vlaky/app/MainActivity.java

        # 5. Tvoje rýchle HTML, ktoré stiahne ŽSR bez CORS chýb
        echo '<!DOCTYPE html>
        <html lang="sk">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Vlaky</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; text-align: center; }
                h2 { color: #003366; }
                input, button { width: 100%; padding: 14px; margin-top: 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
                button { background: #003366; color: white; font-weight: bold; border: none; }
                #status { margin-top: 15px; font-weight: bold; }
                #box { display: none; margin-top: 20px; border: 2px solid #003366; border-radius: 8px; background: #fff; }
                iframe { width: 100%; height: 450px; border: none; }
            </style>
        </head>
        <body>
            <h2>Detail Vlaku ŽSR</h2>
            <input type="number" id="vlakCislo" placeholder="Číslo vlaku">
            <input type="date" id="vlakDatum">
            <button onclick="hladaj()">Zobraziť detail</button>
            <div id="status"></div>
            <div id="box"><iframe id="vlakIframe" src=""></iframe></div>

            <script>
                const dnes = new Date();
                document.getElementById("vlakDatum").value = `${dnes.getFullYear()}-${String(dnes.getMonth() + 1).padStart(2, "0")}-${String(dnes.getDate()).padStart(2, "0")}`;

                async function hladaj() {
                    const cislo = document.getElementById("vlakCislo").value.trim();
                    const datum = document.getElementById("vlakDatum").value;
                    const status = document.getElementById("status");
                    const box = document.getElementById("box");
                    const iframe = document.getElementById("vlakIframe");

                    if (!cislo) { alert("Zadaj číslo!"); return; }
                    box.style.display = "none";
                    status.innerText = "Načítavam ŽSR dáta...";

                    const vlak6 = cislo.padStart(6, "0");
                    const p = datum.split("-");
                    const datumStr = p[0].substring(2) + p[1] + p[2];

                    try {
                        const response = await fetch("https://tis.zsr.sk/mapavlakov/api/osobne");
                        const text = await response.text();
                        const hladajStr = `\"DetailVlakuStr\":\"${datumStr}${vlak6}`;
                        const idx = text.indexOf(hAddress || hladajStr);

                        if (idx === -1) throw new Error("Vlak nenašiel.");

                        const stanica = text.substring(idx + hladajStr.length, idx + hladajStr.length + 6);
                        iframe.src = `https://tis.zsr.sk/pis/popup.jsp?id=vlakDetailCore&vlkId=${datumStr}${vlak6}${stanica}`;
                        box.style.display = "block";
                        status.innerText = "";
                    } catch (e) {
                        status.innerText = "Vlak sa nenašiel.";
                    }
                }
            </script>
        </body>
        </html>' > ŠTRUKTÚRA/app/src/main/assets/index.html

    - name: Nastav Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Spusť kompiláciu do APK
      run: |
        cd ŠTRUKTÚRA
        chmod +x gradlew || true
        # Použijeme vstavaný gradle na skompilovanie čistého debug APK
        gradle assembleDebug || npx react-native build-android --mode=debug || ./gradlew assembleDebug

    - name: Odovzdaj hotové APK na stiahnutie
      uses: actions/upload-artifact@v4
      with:
        name: MojaVlakovaApka
        path: '**/build/outputs/apk/debug/*.apk'
